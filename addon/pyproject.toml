[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tc002-awtrix-bridge"
version = "0.2.44"
description = "AWTRIX NG compatibility bridge for the Ulanzi TC002 Pixbar"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "aiohttp>=3.10,<4",
  "certifi>=2024.8.30",
  "paho-mqtt>=2.1,<3",
  "Pillow>=10,<13",
  "PyYAML>=6,<7",
]

[project.scripts]
tc002-awtrix-bridge = "tc002_awtrix_bridge.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tc002_awtrix_bridge = ["assets/*.bdf", "assets/*.LICENSE", "web/*.html"]
